# gateway-service — self-contained project root (ADR-0008 G1).
# Independent of the platform's pyproject; nothing here touches the platform.

[project]
name = "provider-gateway"
version = "0.1.0"
description = "Remote Provider Gateway — data plane (ADR-0008). G1 skeleton: no live providers."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "filelock>=3.16",  # Syntx interprocess pool transactions
    "httpx>=0.27",  # G3: live providers make real upstream calls (providers/groq)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not external_provider'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: hermetic unit or adapter test",
    "contract: Gateway and provider contract/parity test",
    "integration: local in-process Gateway or SDK integration test",
    "external_provider: requires a live upstream, provider account state, or provider-specific fixture",
    "external: detail marker for tests requiring live network/upstream access",
    "provider_env: detail marker for provider account state or optional local-domain fixtures",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
